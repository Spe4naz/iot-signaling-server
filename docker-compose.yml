# Standalone signaling server.
# Note: for the full stack (MQTT + nginx + TLS) see the monorepo's
# deploy/docker stack, where this image runs as the `server` service.

services:
  server:
    build: .
    image: iot-signaling-server:latest
    restart: unless-stopped
    environment:
      PORT: "3100"
      HOST: "0.0.0.0"
      REGISTER_TOKEN: "${REGISTER_TOKEN:-}"
      STALE_MS: "${STALE_MS:-180000}"
      REGISTRY_FILE: /app/data/devices.json
      ALERTS_FILE: /app/data/alerts.json
      RULES_FILE: /app/data/rules.json
    ports:
      - "3100:3100"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s